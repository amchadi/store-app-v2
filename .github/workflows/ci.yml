name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: CI Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: store_app
          MYSQL_USER: store_app
          MYSQL_PASSWORD: store_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://store_app:store_app@127.0.0.1:3306/store_app
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: store_app
      DB_PASSWORD: store_app
      DB_NAME: store_app

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check formatting
        run: npx nx format:check --base="remotes/origin/main"

      - name: Run validation
        run: npx nx run-many -t lint test build typecheck

      - name: Run E2E
        run: npx nx e2e @org/api-e2e --verboseoo
